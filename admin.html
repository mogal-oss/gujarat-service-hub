<!doctype html>
<html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gujarat Service Hub | Admin Login</title>
<style>
:root{--navy:#102746;--blue:#1769aa;--gold:#d7a943;--ink:#1b2b40;--muted:#64748b;--border:#dce4ee}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Gujarati',sans-serif;background:linear-gradient(135deg,#edf4fb,#f8fafc);color:var(--ink);min-height:100vh}header{background:var(--navy);color:white;padding:18px 24px}header a{color:#fff;text-decoration:none;font-weight:bold}main{max-width:900px;margin:48px auto;padding:0 18px}.box{background:white;border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 18px 50px #10274618}.kicker{color:var(--gold);font-size:12px;font-weight:bold;letter-spacing:2px}h1{color:var(--navy);margin:8px 0}p{color:var(--muted);line-height:1.6}form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-top:22px}label{display:block;font-size:14px;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;font-size:16px}button{padding:13px 18px;border:0;border-radius:10px;background:var(--blue);color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.status{margin-top:14px;font-size:14px}.tools{margin-top:22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:var(--navy)}.list{display:grid;gap:12px;margin-top:16px}.item{border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.item h3{margin:0 0 8px;color:var(--navy)}.item p{margin:4px 0}.approve{background:#16834a}.reject{background:#b42318}.hidden{display:none!important}@media(max-width:700px){form{grid-template-columns:1fr}.box{padding:20px}}
</style></head><body><header><a href="./">Gujarat Service Hub</a></header><main><div class="box"><span class="kicker">PRIVATE ADMIN AREA</span><h1>એડમિન લૉગિન</h1><p>અહીંથી બિઝનેસ રજિસ્ટ્રેશનની અરજીઓ તપાસી મંજૂર અથવા નામંજૂર કરી શકો છો. આ પેજ જાહેર હોમપેજ પર દેખાતું નથી.</p>
<form id="loginForm"><div><label for="email">એડમિન ઈમેલ</label><input id="email" type="email" autocomplete="username" required placeholder="એડમિન ઈમેલ"></div><div><label for="password">પાસવર્ડ</label><input id="password" type="password" autocomplete="current-password" required placeholder="પાસવર્ડ"></div><button id="loginBtn">લૉગિન કરો</button></form><div id="status" class="status" role="status">એડમિન માટે લૉગિન જરૂરી છે.</div>
<div id="tools" class="tools hidden"><div class="actions"><button id="refresh" type="button">અરજીઓ ફરી લોડ કરો</button><button id="logout" class="secondary" type="button">લૉગઆઉટ</button></div><div id="list" class="list"></div></div></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {
      apiKey: "AIzaSyAcdBH05h8GGrcoAMdjVTDvKzwhsUCOA",
      authDomain: "gujarat-service-hub.firebaseapp.com",
      projectId: "gujarat-service-hub",
      storageBucket: "gujarat-service-hub.firebasestorage.app",
      messagingSenderId: "866736197862",
      appId: "1:866736197862:web:bec086ead0c36ec7a76b27",
      measurementId: "G-1KF592C1JN"
    };
const ADMIN_UID = "erpvkfrYTIeMiTUsZvEQSzFmhYC2";
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const statusEl=document.getElementById('status'), tools=document.getElementById('tools'), list=document.getElementById('list');
function message(t){statusEl.textContent=t;}
function isAdmin(){return !!auth.currentUser && auth.currentUser.uid===ADMIN_UID;}
async function loadPending(){if(!isAdmin()){message('આ પેનલ માટે અધિકૃત એડમિન લૉગિન જરૂરી છે.');return;}list.textContent='અરજીઓ લોડ થઈ રહી છે...';try{const snap=await getDocs(query(collection(db,'businesses'),where('status','==','pending')));list.innerHTML='';if(snap.empty){list.textContent='નવી પેન્ડિંગ અરજી નથી.';return;}for(const d of snap.docs){const b=d.data(),item=document.createElement('div');item.className='item';const info=document.createElement('div'),h=document.createElement('h3');h.textContent=b.businessName||'નામ વગરનો બિઝનેસ';const p=document.createElement('p');p.textContent=`અરજદાર: ${b.providerName||'—'} | કેટેગરી: ${b.category||'—'}`;const p2=document.createElement('p');p2.textContent=`શહેર/ગામ: ${b.city||'—'} | મોબાઇલ: ${b.phone||'—'}`;const p3=document.createElement('p');p3.textContent=`વધારાની માહિતી: ${b.details||'નથી'}`;info.append(h,p,p2,p3);const actions=document.createElement('div');actions.className='actions';for(const [label,state,cls] of [['મંજૂર કરો','approved','approve'],['નામંજૂર કરો','rejected','reject']]){const btn=document.createElement('button');btn.type='button';btn.className=cls;btn.textContent=label;btn.addEventListener('click',()=>updateApplication(d.id,state));actions.append(btn);}item.append(info,actions);list.append(item);}}catch(e){console.error(e);list.textContent='અરજીઓ લોડ થઈ નથી. Admin UID અને Firestore Rules તપાસો.';}}
async function updateApplication(id,state){if(!isAdmin())return;try{await updateDoc(doc(db,'businesses',id),{status:state,reviewedAt:serverTimestamp(),reviewedBy:auth.currentUser.uid});message(state==='approved'?'બિઝનેસ મંજૂર થયો.':'અરજી નામંજૂર થઈ.');await loadPending();}catch(e){console.error(e);message('સ્ટેટસ બદલાયો નથી. Firestore Rules તપાસો.');}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='લૉગિન...';try{const cred=await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);if(cred.user.uid!==ADMIN_UID){await signOut(auth);message('આ એકાઉન્ટને એડમિન અધિકાર નથી. Firebase માં સાચો Admin UID તપાસો.');tools.classList.add('hidden');return;}message('એડમિન લૉગિન સફળ.');tools.classList.remove('hidden');await loadPending();}catch(err){console.error(err);message('લૉગિન નિષ્ફળ. ઈમેલ/પાસવર્ડ અને Firebase Authentication તપાસો.');}finally{btn.disabled=false;btn.textContent='લૉગિન કરો';}});
document.getElementById('refresh').addEventListener('click',loadPending);document.getElementById('logout').addEventListener('click',async()=>{await signOut(auth);tools.classList.add('hidden');message('તમે લૉગઆઉટ થઈ ગયા છો.');});onAuthStateChanged(auth,user=>{if(user&&user.uid===ADMIN_UID){tools.classList.remove('hidden');message('એડમિન સેશન સક્રિય છે.');loadPending();}else tools.classList.add('hidden');});
</script></body></html>
