<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1f3a">
<title>લોગિન | Gujarat Service Hub</title>
<style>
:root{--navy:#071a33;--blue:#1769e8;--gold:#f5bd50;--muted:#66758a;--border:#dce5f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 14px;font-family:Arial,"Noto Sans Gujarati",sans-serif;background:radial-gradient(circle at 15% 10%,#275b9b 0,transparent 35%),linear-gradient(135deg,#061226,#0c2a52 60%,#174b89);color:#14233b}
.card{width:100%;max-width:480px;background:#fff;border:1px solid #ffffff55;border-radius:26px;padding:30px;box-shadow:0 28px 80px #0004}
.brand{text-align:center;margin-bottom:24px}.logo{width:66px;height:66px;border-radius:19px;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(135deg,#0b2852,#2878f0);color:#fff;font-size:30px;font-weight:900;box-shadow:0 12px 25px #1769e833}
h1{font-size:25px;margin:0;color:var(--navy)}.brand p{font-size:14px;line-height:1.7;color:var(--muted);margin:9px 0 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:5px;background:#f0f4f9;border-radius:13px;margin:22px 0}
.tab{border:0;border-radius:10px;padding:12px 8px;font-weight:700;color:#5c6c81;background:transparent;cursor:pointer}.tab.active{background:#fff;color:#1459b0;box-shadow:0 2px 9px #00152c12}
.field{margin-bottom:16px}label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
input{width:100%;padding:14px;border:1px solid var(--border);border-radius:11px;font-size:15px;outline:none;background:#fff}input:focus{border-color:#2878f0;box-shadow:0 0 0 3px #2878f01a}
.btn{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#1769e8,#3288ff);color:white;font-size:15px;font-weight:800;cursor:pointer;margin-top:5px}.btn:disabled{opacity:.6;cursor:wait}.btn.light{background:#edf5ff;color:#1459b0;margin-top:10px}
.linkrow{text-align:center;margin-top:15px}.link{border:0;background:transparent;color:#1559ac;text-decoration:underline;cursor:pointer;font-size:14px}
.message{display:none;margin:12px 0;padding:12px;border-radius:10px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}.message.error{display:block;background:#fff0f0;color:#a61b1b}.message.success{display:block;background:#eafaf0;color:#17663a}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0}
#recaptcha-container{display:flex;justify-content:center;overflow:hidden;margin:12px 0}
.back{display:block;text-align:center;margin-top:24px;text-decoration:none;color:var(--muted);font-size:14px}
.hidden{display:none!important}
@media(max-width:400px){.card{padding:23px 17px}h1{font-size:22px}}
</style>
</head>
<body>
<main class="card">
<header class="brand">
<div class="logo">G</div>
<h1>Gujarat Service Hub</h1>
<p>તમારા એકાઉન્ટમાં લોગિન કરો<br>અથવા નવું એકાઉન્ટ બનાવો</p>
</header>
<div id="message" class="message" role="status" aria-live="polite"></div>
<div class="tabs">
<button class="tab active" id="emailTab" type="button">ઈમેલ લોગિન</button>
<button class="tab" id="phoneTab" type="button">મોબાઈલ OTP</button>
</div>
<section id="emailSection">
<form id="emailForm">
<div class="field"><label for="email">ઈમેલ એડ્રેસ</label><input id="email" type="email" autocomplete="email" placeholder="તમારો ઈમેલ દાખલ કરો" required></div>
<div class="field"><label for="password">પાસવર્ડ</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="પાસવર્ડ દાખલ કરો" required></div>
<button class="btn" id="emailSubmit" type="submit">લોગિન કરો</button>
</form>
<button class="btn light" id="registerBtn" type="button">નવું એકાઉન્ટ બનાવો</button>
<div class="linkrow"><button class="link" id="forgotBtn" type="button">પાસવર્ડ ભૂલી ગયા છો?</button></div>
</section>
<section id="phoneSection" class="hidden">
<form id="phoneForm">
<div class="field"><label for="phone">મોબાઈલ નંબર</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="10 અંકનો મોબાઈલ નંબર" required></div>
<p class="note">ભારતનો 10 અંકનો મોબાઈલ નંબર દાખલ કરો. OTP મોકલવા માટે reCAPTCHA ચકાસણી જરૂરી છે.</p>
<div id="recaptcha-container"></div>
<button class="btn" id="sendOtpBtn" type="submit">OTP મોકલો</button>
</form>
<div id="otpSection" class="hidden" style="margin-top:20px">
<form id="otpForm">
<div class="field"><label for="otp">SMS દ્વારા મળેલો OTP</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6 અંકનો OTP" required></div>
<button class="btn" id="verifyOtpBtn" type="submit">OTP ચકાસો અને લોગિન કરો</button>
</form>
<button class="btn light" id="resendBtn" type="button">ફરી OTP મોકલો</button>
</div>
</section>
<a class="back" href="./index.html">← મુખ્ય પેજ પર પાછા જાઓ</a>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// Firebase config — API Key supplied by you
const firebaseConfig = {
  apiKey: "AIzaSyAcdBH05h8GGrcoAMdjVTDvKzwhsUCOgTA",
  authDomain: "gujarat-service-hub.firebaseapp.com",
  projectId: "gujarat-service-hub",
  storageBucket: "gujarat-service-hub.firebasestorage.app",
  messagingSenderId: "866736197862",
  appId: "1:866736197862:web:bec086ead0c36ec7a76b27",
  measurementId: "G-1KF592C1JN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const $ = id => document.getElementById(id);
let registerMode = false, confirmationResult = null, recaptchaVerifier = null;

function message(text,type="error"){ $("message").textContent=text; $("message").className="message "+type; }
function clearMessage(){ $("message").textContent=""; $("message").className="message"; }
function busy(btn,on,text="કૃપા કરીને રાહ જુઓ..."){ if(!btn.dataset.original)btn.dataset.original=btn.textContent;btn.disabled=on;btn.textContent=on?text:btn.dataset.original; }
function errorText(e){
 const m={
 "auth/api-key-not-valid":"Firebase API Key માન્ય નથી. Firebase Console માંથી સાચી Web App Config તપાસો.",
 "auth/invalid-api-key":"Firebase API Key ખોટી છે.",
 "auth/unauthorized-domain":"Firebase Authentication → Settings → Authorized domains માં mogal-oss.github.io ઉમેરો.",
 "auth/invalid-email":"ઈમેલ એડ્રેસ યોગ્ય નથી.",
 "auth/invalid-credential":"ઈમેલ અથવા પાસવર્ડ ખોટો છે.",
 "auth/user-not-found":"આ ઈમેલથી એકાઉન્ટ મળ્યું નથી.",
 "auth/wrong-password":"પાસવર્ડ ખોટો છે.",
 "auth/email-already-in-use":"આ ઈમેલથી એકાઉન્ટ પહેલેથી છે. લોગિન કરો.",
 "auth/weak-password":"પાસવર્ડ ઓછામાં ઓછો 6 અક્ષરનો રાખો.",
 "auth/operation-not-allowed":"Firebase Console માં આ Sign-in પદ્ધતિ Enabled કરો.",
 "auth/invalid-phone-number":"યોગ્ય 10 અંકનો ભારતીય મોબાઈલ નંબર દાખલ કરો.",
 "auth/captcha-check-failed":"reCAPTCHA ચકાસણી નિષ્ફળ ગઈ. ફરી પ્રયાસ કરો.",
 "auth/invalid-app-credential":"reCAPTCHA અથવા Firebase App verification માં સમસ્યા છે.",
 "auth/quota-exceeded":"OTP મોકલવાની મર્યાદા પૂરી થઈ છે. પછી ફરી પ્રયાસ કરો.",
 "auth/code-expired":"OTPની સમયમર્યાદા પૂરી થઈ છે. નવો OTP મંગાવો.",
 "auth/invalid-verification-code":"OTP ખોટો છે. ફરી તપાસો.",
 "auth/network-request-failed":"ઇન્ટરનેટ કનેક્શન તપાસો."
 };
 return m[e?.code] || `Error: ${e?.code || ""} ${e?.message || "અજ્ઞાત સમસ્યા"}`;
}
async function persist(){await setPersistence(auth,browserLocalPersistence);}
function emailMode(){clearMessage();$("emailSection").classList.remove("hidden");$("phoneSection").classList.add("hidden");$("emailTab").classList.add("active");$("phoneTab").classList.remove("active");}
function phoneMode(){clearMessage();$("emailSection").classList.add("hidden");$("phoneSection").classList.remove("hidden");$("emailTab").classList.remove("active");$("phoneTab").classList.add("active");}
$("emailTab").addEventListener("click",emailMode);
$("phoneTab").addEventListener("click",phoneMode);

$("emailForm").addEventListener("submit",async e=>{
 e.preventDefault();clearMessage();busy($("emailSubmit"),true);
 try{
  await persist();
  if(registerMode){await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);message("તમારું એકાઉન્ટ સફળતાપૂર્વક બની ગયું છે.","success");}
  else{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);message("લોગિન સફળ થયું! મુખ્ય પેજ ખૂલી રહ્યું છે.","success");setTimeout(()=>location.href="./index.html",900);}
 }catch(err){message(errorText(err));}finally{busy($("emailSubmit"),false);}
});
$("registerBtn").addEventListener("click",()=>{
 registerMode=!registerMode;clearMessage();
 $("emailSubmit").textContent=registerMode?"એકાઉન્ટ બનાવો":"લોગિન કરો";
 $("emailSubmit").dataset.original=$("emailSubmit").textContent;
 $("registerBtn").textContent=registerMode?"પહેલેથી એકાઉન્ટ છે? લોગિન કરો":"નવું એકાઉન્ટ બનાવો";
 $("password").autocomplete=registerMode?"new-password":"current-password";
});
$("forgotBtn").addEventListener("click",async()=>{
 clearMessage();const email=$("email").value.trim();
 if(!email){message("પાસવર્ડ રીસેટ કરવા પહેલાં ઈમેલ દાખલ કરો.");$("email").focus();return;}
 busy($("forgotBtn"),true);
 try{await sendPasswordResetEmail(auth,email);message("પાસવર્ડ રીસેટ માટે ઈમેલ મોકલ્યો છે. Inbox અને Spam તપાસો.","success");}
 catch(err){message(errorText(err));}finally{busy($("forgotBtn"),false);}
});
async function setupRecaptcha(){
 if(recaptchaVerifier){try{recaptchaVerifier.clear();}catch(_){}}
 $("recaptcha-container").replaceChildren();
 recaptchaVerifier=new RecaptchaVerifier(auth,"recaptcha-container",{
  size:"normal",
  callback:()=>clearMessage(),
  "expired-callback":()=>message("reCAPTCHAની સમયમર્યાદા પૂરી થઈ. ફરી ચકાસો.")
 });
 await recaptchaVerifier.render();
}
async function sendOtp(){
 clearMessage();
 const digits=$("phone").value.trim();
 if(!/^[6-9][0-9]{9}$/.test(digits)){message("યોગ્ય 10 અંકનો ભારતીય મોબાઈલ નંબર દાખલ કરો.");return;}
 busy($("sendOtpBtn"),true,"OTP મોકલાઈ રહ્યો છે...");
 try{
  await persist();
  if(!recaptchaVerifier)await setupRecaptcha();
  confirmationResult=await signInWithPhoneNumber(auth,"+91"+digits,recaptchaVerifier);
  $("otpSection").classList.remove("hidden");
  message("OTP મોકલ્યો છે. SMS માં આવેલો OTP દાખલ કરો.","success");
  $("otp").focus();
 }catch(err){
  message(errorText(err));
  if(recaptchaVerifier){try{recaptchaVerifier.clear();}catch(_){}}
  recaptchaVerifier=null;$("recaptcha-container").replaceChildren();
 }finally{busy($("sendOtpBtn"),false);}
}
$("phoneForm").addEventListener("submit",e=>{e.preventDefault();sendOtp();});
$("resendBtn").addEventListener("click",async()=>{$("otpSection").classList.add("hidden");confirmationResult=null;await sendOtp();});
$("otpForm").addEventListener("submit",async e=>{
 e.preventDefault();clearMessage();
 const code=$("otp").value.trim();
 if(!/^[0-9]{6}$/.test(code)){message("6 અંકનો OTP દાખલ કરો.");return;}
 if(!confirmationResult){message("પહેલાં OTP મંગાવો.");return;}
 busy($("verifyOtpBtn"),true,"OTP ચકાસાઈ રહ્યો છે...");
 try{await persist();await confirmationResult.confirm(code);message("મોબાઈલ OTPથી લોગિન સફળ થયું!","success");setTimeout(()=>location.href="./index.html",900);}
 catch(err){message(errorText(err));}finally{busy($("verifyOtpBtn"),false);}
});
onAuthStateChanged(auth,user=>{if(user)console.log("Firebase signed in:",user.uid);});
</script>
</body>
</html>
